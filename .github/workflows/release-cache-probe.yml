name: release-cache-probe

# Measures Namespace cache-volume effectiveness for the CUDA release builds before wiring
# caching into release.yml. Dispatch twice: the first run seeds the volume (cold), the
# second measures warm. The profile cache is bind-mounted into the job container, and the
# Cargo, Rustup, and build directories are placed directly on it.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cache-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # No container: reports where the runner host mounts the cache volume (ground truth for
  # the /cache path the probe job assumes).
  hostinfo:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: namespace-profile-cuda-x86-64 }
          - { runner: namespace-profile-cuda-arm64 }
    steps:
      - run: |
          echo "NSC_CACHE_PATH=${NSC_CACHE_PATH:-<unset>}"
          [ -n "${NSC_CACHE_PATH:-}" ] && df -h "$NSC_CACHE_PATH" || true
          mount | grep -i cache || true

  probe:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 32x64 boxes OOM at 32-wide rustc (~2GB each): kernel kills cargo (exit 137)
          # or the runner agent ("lost communication"); 16 leaves ~32GB headroom.
          # arm64 kill window coincides with flash-attn's nvcc storm (hd512 ~5GB each) overlapping
          # the rustc phase; 8 nvcc + 16 rustc keeps peak under 64GB.
          - { sm: "90", runner: namespace-profile-cuda-x86-64, cuda: "13.0.0", cargo_jobs: "32", cudaforge: "12" }
          - { sm: "90", runner: namespace-profile-cuda-arm64, cuda: "13.0.0", cargo_jobs: "16", cudaforge: "8" }
    container:
      image: docker.io/nvidia/cuda:${{ matrix.cuda }}-cudnn-devel-ubuntu22.04
      volumes:
        - /cache:/cache
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
      CUDA_COMPUTE_CAP: ${{ matrix.sm }}
      CUDA_TOOLKIT_PATH: /usr/local/cuda
      CUDAFORGE_THREADS: ${{ matrix.cudaforge }}
      RUSTFLAGS: "-C target-cpu=generic"
      CARGO_HOME: /cache/cargo
      RUSTUP_HOME: /cache/rustup
      CUDAFORGE_HOME: /cache/cudaforge
      CARGO_TARGET_DIR: /cache/target-sm${{ matrix.sm }}-cuda${{ matrix.cuda }}
    steps:
      - name: Cache volume sanity
        run: |
          df -h /cache
          ls /cache || true
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config libssl-dev patchelf git
          ldconfig
          nccl_lib="$(ldconfig -p | awk '$1 == "libnccl.so" { print $NF; exit }')"
          if [ -z "$nccl_lib" ]; then
            nccl_runtime="$(ldconfig -p | awk '$1 == "libnccl.so.2" { print $NF; exit }')"
            if [ -n "$nccl_runtime" ]; then
              ln -sf "$nccl_runtime" "$(dirname "$nccl_runtime")/libnccl.so"
            else
              apt-get install -y --no-install-recommends libnccl-dev
            fi
          fi
          rm -rf /var/lib/apt/lists/*
      - name: Restore cached Cargo tools
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Timed build
        run: |
          ( while true; do
              echo "MEMSAMPLE $(date -u +%H:%M:%S) $(free -m | awk '/Mem:/{print $3"MB/"$2"MB"}') top: $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s:%dMB ", $2, $1/1024}')"
              sleep 10
            done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          start=$(date +%s)
          cargo build --release --locked --offline --features "cuda flash-attn nccl" -p mistralrs-cli
          end=$(date +%s)
          kill "$sampler" 2>/dev/null || true
          trap - EXIT
          echo "BUILD_SECONDS=$((end - start))" | tee -a "$GITHUB_ENV"
      - name: Report
        run: |
          {
            echo "### cache probe (${{ matrix.runner }}, sm${{ matrix.sm }})"
            echo "- build: ${BUILD_SECONDS}s"
            echo "- target: $(du -sh "$CARGO_TARGET_DIR" | cut -f1)"
            echo "- cargo home: $(du -sh /cache/cargo 2>/dev/null | cut -f1)"
            echo "- cudaforge: $(du -sh "$CUDAFORGE_HOME" 2>/dev/null | cut -f1)"
            echo "- volume: $(df -h /cache | tail -1)"
          } >> "$GITHUB_STEP_SUMMARY"
