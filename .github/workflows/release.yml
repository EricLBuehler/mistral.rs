  docker-cuda-manifest:
    needs: [preflight, docker-cuda]
    if: ${{ !inputs.dry_run && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sm: "80", cuda_asset: "128", arches: "amd64" }
          - { sm: "86", cuda_asset: "128", arches: "amd64" }
          - { sm: "89", cuda_asset: "128", arches: "amd64" }
          - { sm: "90", cuda_asset: "128", arches: "amd64 arm64" }
          - { sm: "100", cuda_asset: "128", arches: "amd64 arm64" }
          - { sm: "120", cuda_asset: "128", arches: "amd64" }
          - { sm: "121", cuda_asset: "129", arches: "arm64" }
          - { sm: "80", cuda_asset: "130", arches: "amd64" }
          - { sm: "86", cuda_asset: "130", arches: "amd64" }
          - { sm: "89", cuda_asset: "130", arches: "amd64" }
          - { sm: "90", cuda_asset: "130", arches: "amd64 arm64" }
          - { sm: "100", cuda_asset: "130", arches: "amd64 arm64" }
          - { sm: "120", cuda_asset: "130", arches: "amd64" }
          - { sm: "121", cuda_asset: "130", arches: "arm64" }
          - { sm: "80", cuda_asset: "131", arches: "amd64" }
          - { sm: "86", cuda_asset: "131", arches: "amd64" }
          - { sm: "89", cuda_asset: "131", arches: "amd64" }
          - { sm: "90", cuda_asset: "131", arches: "amd64 arm64" }
          - { sm: "100", cuda_asset: "131", arches: "amd64 arm64" }
          - { sm: "120", cuda_asset: "131", arches: "amd64" }
          - { sm: "121", cuda_asset: "131", arches: "arm64" }
          - { sm: "80", cuda_asset: "132", arches: "amd64" }
          - { sm: "86", cuda_asset: "132", arches: "amd64" }
          - { sm: "89", cuda_asset: "132", arches: "amd64" }
          - { sm: "100", cuda_asset: "132", arches: "amd64 arm64" }
          - { sm: "120", cuda_asset: "132", arches: "amd64" }
          - { sm: "121", cuda_asset: "132", arches: "arm64" }
          - { sm: "90", cuda_asset: "133", arches: "amd64 arm64" }
    steps:
      - name: Version tag
        id: ver
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: echo "v=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Docker manifest
        env:
          CUDA_ASSET: ${{ matrix.cuda_asset }}
          SM: ${{ matrix.sm }}
          ARCHES: ${{ matrix.arches }}
          VERSION: ${{ steps.ver.outputs.v }}
        run: |
          image=ghcr.io/ericlbuehler/mistral.rs
          sources=()
          for arch in $ARCHES; do
            sources+=("${image}:cuda${CUDA_ASSET}-sm${SM}-${VERSION}-${arch}")
          done

          tags=(
            -t "${image}:cuda${CUDA_ASSET}-sm${SM}-${VERSION}"
          )
          if [ "$CUDA_ASSET" = "131" ]; then
            tags+=(
              -t "${image}:cuda-sm${SM}-${VERSION}"
            )
          fi

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

  # Real (non-prerelease) tags from the canonical repo publish the wheels (built in the metal /
  # linux-cpu / windows-cpu jobs above) to PyPI via OIDC (no token). rc tags build the wheels as
  # artifacts but skip publishing. CUDA wheels are shipped as release assets, not to PyPI.
  pypi-publish:
    needs: [preflight, metal, linux-cpu, linux-cuda, windows-cpu, docker-cpu, docker-cuda, docker-cuda-manifest]
    if: ${{ !cancelled() && github.repository == 'EricLBuehler/mistral.rs' && needs.preflight.outputs.publish_pypi == 'true' && needs.metal.result == 'success' && needs.linux-cpu.result == 'success' && needs.linux-cuda.result == 'success' && needs.windows-cpu.result == 'success' && needs.docker-cpu.result == 'success' && needs.docker-cuda.result == 'success' && needs.docker-cuda-manifest.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release_mistralrs_pypi
    permissions:
      actions: read
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Validate PyPI upload set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          pip3 install --quiet pyyaml==6.0.3
          prior_jobs="$RUNNER_TEMP/prior-pypi-jobs.jsonl"
          : > "$prior_jobs"
          for ((attempt = 1; attempt < RUN_ATTEMPT; attempt++)); do
            gh api --paginate \
              "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$attempt/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "pypi-publish") | {started_at, completed_at} | @json' \
              >> "$prior_jobs"
          done
          export PRIOR_PYPI_JOBS="$prior_jobs"
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          from scripts.verify_release_assets import (
              PYPI_PLATFORMS,
              pypi_mismatches_are_recoverable,
              verify_pypi_dist_hashes,
              verify_pypi_wheels,
          )

          version = os.environ["VERSION"]
          wheels = sorted(Path("dist").glob("*.whl"))
          local_data = {
              "urls": [
                  {"filename": wheel.name, "packagetype": "bdist_wheel"}
                  for wheel in wheels
              ]
          }
          verified, missing, invalid = verify_pypi_wheels(local_data, version)
          if verified != len(PYPI_PLATFORMS) or missing or invalid:
              raise SystemExit(f"invalid PyPI upload set: {missing + invalid}")

          url = f"https://pypi.org/pypi/mistralrs/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  remote_data = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              remote_data = {"urls": []}

          complete, remote_missing, mismatched = verify_pypi_dist_hashes(
              remote_data, wheels
          )
          with open(os.environ["PRIOR_PYPI_JOBS"], encoding="utf-8") as job_file:
              prior_jobs = [json.loads(line) for line in job_file if line.strip()]
          recoverable = pypi_mismatches_are_recoverable(
              remote_data, mismatched, complete, prior_jobs
          )
          if mismatched and not recoverable:
              raise SystemExit(f"existing PyPI files have different hashes: {mismatched}")
          if mismatched:
              print(f"Existing PyPI files came from an earlier build: {mismatched}")

          if complete:
              print("All PyPI files already exist; publication will be idempotent.")
          elif remote_missing:
              print(f"PyPI files to upload: {', '.join(remote_missing)}")
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # The release contract check: every tarball, wheel, image, and (non-rc) PyPI version the
  # matrices promise must exist, or this fails with the missing list. Job status alone lies
  # in both directions (soft-failed steps look green, one flaked leg skips whole legs).
  verify-release:
    needs: [preflight, metal, linux-cpu, windows-cpu, linux-cuda, docker-cpu, docker-cuda, docker-cuda-manifest, pypi-publish]
    if: ${{ !cancelled() && !inputs.dry_run && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ATTEMPTS: "3"
          RETRY_SECONDS: "30"
        run: |
          pip3 install --quiet pyyaml==6.0.3
          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
            if python3 scripts/verify_release_assets.py "${{ needs.preflight.outputs.tag }}"; then
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              exit 1
            fi
            sleep "$((attempt * RETRY_SECONDS))"
          done
      - name: Require successful PyPI publication
        if: ${{ always() && needs.preflight.outputs.publish_pypi == 'true' && needs.pypi-publish.result != 'success' }}
        run: |
          echo "PyPI publication did not complete successfully." >&2
          exit 1

  publish-latest:
    needs: [preflight, verify-release]
    if: ${{ needs.verify-release.result == 'success' && needs.preflight.outputs.publish_latest == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified Docker images
        env:
          MAX_ATTEMPTS: "3"
          RETRY_SECONDS: "10"
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          pip3 install --quiet pyyaml==6.0.3
          python3 - <<'PY'
          import os
          import subprocess
          import time

          import yaml

          image = "ghcr.io/ericlbuehler/mistral.rs"
          max_attempts = int(os.environ["MAX_ATTEMPTS"])
          retry_seconds = int(os.environ["RETRY_SECONDS"])
          version = os.environ["VERSION"]

          def promote(source, targets):
              command = ["docker", "buildx", "imagetools", "create"]
              for target in targets:
                  command.extend(["-t", target])
              for attempt in range(1, max_attempts + 1):
                  try:
                      subprocess.run([*command, source], check=True)
                      return
                  except subprocess.CalledProcessError:
                      if attempt == max_attempts:
                          raise
                      time.sleep(attempt * retry_seconds)

          promote(f"{image}:cpu-{version}", [f"{image}:cpu-latest", f"{image}:latest"])

          with open(".github/workflows/release.yml") as f:
              workflow = yaml.safe_load(f)
          rows = workflow["jobs"]["docker-cuda-manifest"]["strategy"]["matrix"]["include"]
          for row in rows:
              cuda_asset = row["cuda_asset"]
              sm = row["sm"]
              source = f"{image}:cuda{cuda_asset}-sm{sm}-{version}"
              targets = [f"{image}:cuda{cuda_asset}-sm{sm}-latest"]
              if cuda_asset == "131":
                  targets.append(f"{image}:cuda-sm{sm}-latest")
              promote(source, targets)
          PY

  publish-release:
    needs: [preflight, verify-release, publish-latest]
    if: ${{ !cancelled() && needs.verify-release.result == 'success' && (needs.preflight.outputs.publish_latest != 'true' || needs.publish-latest.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_LATEST: ${{ needs.preflight.outputs.publish_latest }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail

          prerelease=false
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          fi

          make_latest=false
          if [ "$PUBLISH_LATEST" = "true" ]; then
            make_latest=true
          else
            latest_tag="$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)"
            if [ "$latest_tag" = "$TAG" ]; then
              make_latest=true
            fi
          fi

          release_api="$(gh release view "$TAG" -R "$REPOSITORY" --json apiUrl --jq .apiUrl)"
          release_id="${release_api##*/}"
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "invalid GitHub release API URL: $release_api" >&2
            exit 1
          fi
          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease="$prerelease" \
            -f make_latest="$make_latest" >/dev/null
