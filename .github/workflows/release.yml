name: release

# Builds prebuilt binaries for every supported target on a version tag and uploads
# them to the GitHub release. install.sh / install.ps1 download these, and the Docker
# images use the same binaries.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to (must already exist). Ignored when dry_run is set."
        required: false
        type: string
      dry_run:
        description: "Build the full matrix but upload nothing (no GitHub release, Docker push, or PyPI)."
        required: false
        default: false
        type: boolean
      publish_pypi:
        description: "Publish stable wheels to PyPI during a manual release or repair. Tag pushes publish automatically."
        required: false
        default: false
        type: boolean
      update_latest:
        description: "Move stable Docker aliases and mark the GitHub release latest. Tag pushes update automatically."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Dedupe release runs for the same tag; never cancel a run mid-upload.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.context.outputs.build_ref }}
      publish_latest: ${{ steps.context.outputs.publish_latest }}
      publish_pypi: ${{ steps.context.outputs.publish_pypi }}
      release_draft: ${{ steps.release.outputs.draft }}
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Resolve release context
        id: context
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH_PYPI: ${{ inputs.publish_pypi }}
          INPUT_UPDATE_LATEST: ${{ inputs.update_latest }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DRY_RUN" != "true" ] && [ -z "$INPUT_TAG" ]; then
              echo "tag is required unless dry_run is enabled" >&2
              exit 1
            fi
            tag="$INPUT_TAG"
            build_ref="${INPUT_TAG:-$SHA}"
          else
            tag="$REF_NAME"
            build_ref="$REF"
          fi

          release_tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|a|beta|b|rc|c|pre|preview)([.-]?[0-9]+)?)?$'
          if [ -n "$tag" ] && [[ ! "$tag" =~ $release_tag_pattern ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi

          publish_latest=false
          publish_pypi=false
          if [ "$DRY_RUN" != "true" ] && [ "$prerelease" = "false" ]; then
            if [ "$EVENT_NAME" = "push" ] || [ "$INPUT_UPDATE_LATEST" = "true" ]; then
              publish_latest=true
            fi
            if [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH_PYPI" = "true" ]; then
              publish_pypi=true
            fi
          fi

          {
            echo "build_ref=$build_ref"
            echo "publish_latest=$publish_latest"
            echo "publish_pypi=$publish_pypi"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Test release verifier
        run: |
          pip3 install --quiet pyyaml==6.0.3
          python3 -m unittest \
            scripts/test_verify_release_assets.py \
            scripts/test_release_cuda_cache.py
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.build_ref }}
      - name: Verify package versions
        id: versions
        env:
          TAG: ${{ steps.context.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as f:
              workspace_version = tomllib.load(f)["workspace"]["package"]["version"]
          with open("mistralrs-pyo3/Cargo.toml", "rb") as f:
              python_version = tomllib.load(f)["package"]["version"]

          if python_version != workspace_version:
              raise SystemExit(
                  f"workspace version {workspace_version} does not match Python version {python_version}"
              )

          tag = os.environ["TAG"]
          if tag and tag.removeprefix("v") != workspace_version:
              raise SystemExit(f"tag {tag} does not match package version {workspace_version}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={workspace_version}\n")
          PY
      - name: Resolve release state
        id: release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.context.outputs.tag }}
        run: |
          draft=false
          if [ "$DRY_RUN" != "true" ]; then
            if existing_draft="$(gh release view "$TAG" -R "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null)"; then
              draft="$existing_draft"
            else
              create_args=(--draft --verify-tag --title "$TAG" --notes "")
              if [[ "$TAG" == *-* ]]; then
                create_args+=(--prerelease)
              fi
              gh release create "$TAG" -R "${{ github.repository }}" "${create_args[@]}"
              draft=true
            fi
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  metal:
    needs: preflight
    runs-on: macos-15
    env:
      # empty (not generic) so the apple-m1 baseline stays: ring asserts static aes/sha2 on aarch64-apple-darwin
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.build_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Rust dependencies
        run: |
          for i in 1 2 3 4 5; do
            cargo fetch --locked && break
            if [ "$i" = 5 ]; then exit 1; fi
            sleep $((i * 20))
          done
      - name: Build
        run: cargo build --release --locked --offline --features "metal" -p mistralrs-cli
      - name: Package
        run: tar czf mistralrs-metal-aarch64-apple-darwin.tar.gz -C target/release mistralrs
      - uses: softprops/action-gh-release@v2
        id: upload_release_asset
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          draft: ${{ needs.preflight.outputs.release_draft }}
          prerelease: ${{ contains(needs.preflight.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: mistralrs-metal-aarch64-apple-darwin.tar.gz
      - uses: softprops/action-gh-release@v2
        if: ${{ !inputs.dry_run && steps.upload_release_asset.outcome == 'failure' }}
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          draft: ${{ needs.preflight.outputs.release_draft }}
          prerelease: ${{ contains(needs.preflight.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: mistralrs-metal-aarch64-apple-darwin.tar.gz
      - name: Build wheel (Metal)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: mistralrs-pyo3
          command: build
          args: --release --out dist --features metal
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: mistralrs-pyo3/dist/*.whl
          if-no-files-found: error
          overwrite: true

  linux-cpu:
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 runners keep the glibc floor at 2.35; 24.04 binaries need 2.39 and
          # fail on Debian 12 / RHEL 9 era distros.
          - { runner: ubuntu-22.04, triple: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, triple: aarch64-unknown-linux-gnu,
              # v8.2 floor (Graviton2+, Pi 5, 2018+ phones): recovers autovec perf the
              # runtime-dispatched kernels cannot; the installer probes /proc/cpuinfo
              rustflags: "-C target-cpu=generic -C target-feature=+dotprod,+fp16,+fhm",
              skip_wheel: true }
          - { runner: ubuntu-22.04-arm, triple: aarch64-unknown-linux-gnu,
              # ARMv8.0 compat asset and portable manylinux wheel (Pi 4, Graviton1,
              # A72-class SBCs)
              suffix: -v8_0 }
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '-C target-cpu=generic' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.build_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Rust dependencies
        run: |
          for i in 1 2 3 4 5; do
            cargo fetch --locked && break
            if [ "$i" = 5 ]; then exit 1; fi
            sleep $((i * 20))
          done
      - name: Build
        run: cargo build --release --locked --offline -p mistralrs-cli
      - name: Package
        run: tar czf mistralrs-cpu-${{ matrix.triple }}${{ matrix.suffix }}.tar.gz -C target/release mistralrs
      - uses: softprops/action-gh-release@v2
        id: upload_release_asset
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          draft: ${{ needs.preflight.outputs.release_draft }}
          prerelease: ${{ contains(needs.preflight.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: mistralrs-cpu-${{ matrix.triple }}${{ matrix.suffix }}.tar.gz
      - uses: softprops/action-gh-release@v2
        if: ${{ !inputs.dry_run && steps.upload_release_asset.outcome == 'failure' }}
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          draft: ${{ needs.preflight.outputs.release_draft }}
          prerelease: ${{ contains(needs.preflight.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: mistralrs-cpu-${{ matrix.triple }}${{ matrix.suffix }}.tar.gz
      - name: Build wheel (manylinux)
        if: ${{ !matrix.skip_wheel }}
        uses: PyO3/maturin-action@v1
        with:
          working-directory: mistralrs-pyo3
          command: build
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.skip_wheel }}
        with:
          name: wheel-${{ matrix.triple }}
          path: mistralrs-pyo3/dist/*.whl
          if-no-files-found: error
          overwrite: true

  linux-cuda:
    needs: preflight
    # Keep every native compiler axis isolated; bump v1 when compiler or build-hook semantics change.
    runs-on: >-
      ${{ matrix.runner }};overrides.cache-tag=mistral.rs-cuda-v1-${{ matrix.runner }}-${{ matrix.cuda }}-sm${{ matrix.sm }}
    concurrency:
      group: mistral.rs-cuda-v1-${{ matrix.runner }}-${{ matrix.cuda }}-sm${{ matrix.sm }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        # cudnn is intentionally omitted so the binary stays self-contained (no CUDA toolkit
        # needed at runtime); flash-attn covers the attention path. Bundled libs come from ldd.
        # aarch64 covers the Grace parts only (GH200/GB200/GB10); image manifests follow this matrix.
        # cuda_asset is part of the artifact contract: installers choose the newest asset whose
        # toolkit version is not newer than the driver-reported CUDA version from nvidia-smi.
        include:
          - { sm: "80", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "12.8.1", cuda_asset: "128", features: "cuda flash-attn nccl" }
          - { sm: "86", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "12.8.1", cuda_asset: "128", features: "cuda flash-attn nccl" }
          - { sm: "89", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "12.8.1", cuda_asset: "128", features: "cuda flash-attn nccl" }
          - { sm: "90", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "12.8.1", cuda_asset: "128", features: "cuda flash-attn nccl" }
          - { sm: "100", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "12.8.1", cuda_asset: "128", features: "cuda flash-attn nccl" }
          - { sm: "120", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "12.8.1", cuda_asset: "128", features: "cuda flash-attn nccl" }
          - { sm: "90", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "12.8.1", cuda_asset: "128", features: "cuda flash-attn nccl" }
          - { sm: "100", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "12.8.1", cuda_asset: "128", features: "cuda flash-attn nccl" }
          - { sm: "121", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "12.9.1", cuda_asset: "129", features: "cuda flash-attn nccl" }
          - { sm: "80", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.0.0", cuda_asset: "130", features: "cuda flash-attn nccl" }
          - { sm: "86", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.0.0", cuda_asset: "130", features: "cuda flash-attn nccl" }
          - { sm: "89", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.0.0", cuda_asset: "130", features: "cuda flash-attn nccl" }
          - { sm: "90", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.0.0", cuda_asset: "130", features: "cuda flash-attn nccl" }
          - { sm: "100", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.0.0", cuda_asset: "130", features: "cuda flash-attn nccl" }
          - { sm: "120", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.0.0", cuda_asset: "130", features: "cuda flash-attn nccl" }
          - { sm: "90", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "13.0.0", cuda_asset: "130", features: "cuda flash-attn nccl" }
          - { sm: "100", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "13.0.0", cuda_asset: "130", features: "cuda flash-attn nccl" }
          - { sm: "121", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "13.0.0", cuda_asset: "130", features: "cuda flash-attn nccl" }
          - { sm: "80", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.1.2", cuda_asset: "131", features: "cuda flash-attn nccl" }
          - { sm: "86", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.1.2", cuda_asset: "131", features: "cuda flash-attn nccl" }
          - { sm: "89", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.1.2", cuda_asset: "131", features: "cuda flash-attn nccl" }
          - { sm: "90", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.1.2", cuda_asset: "131", features: "cuda flash-attn nccl" }
          - { sm: "100", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.1.2", cuda_asset: "131", features: "cuda flash-attn nccl" }
          - { sm: "120", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.1.2", cuda_asset: "131", features: "cuda flash-attn nccl" }
          - { sm: "90", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "13.1.2", cuda_asset: "131", features: "cuda flash-attn nccl" }
          - { sm: "100", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "13.1.2", cuda_asset: "131", features: "cuda flash-attn nccl" }
          - { sm: "121", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "13.1.2", cuda_asset: "131", features: "cuda flash-attn nccl" }
          - { sm: "80", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.2.0", cuda_asset: "132", features: "cuda flash-attn nccl cutile" }
          - { sm: "86", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.2.0", cuda_asset: "132", features: "cuda flash-attn nccl cutile" }
          - { sm: "89", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.2.0", cuda_asset: "132", features: "cuda flash-attn nccl cutile" }
          - { sm: "100", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.2.0", cuda_asset: "132", features: "cuda flash-attn nccl cutile" }
          - { sm: "120", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.2.0", cuda_asset: "132", features: "cuda flash-attn nccl cutile" }
          - { sm: "100", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "13.2.0", cuda_asset: "132", features: "cuda flash-attn nccl cutile" }
          - { sm: "121", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "13.2.0", cuda_asset: "132", features: "cuda flash-attn nccl cutile" }
          - { sm: "90", runner: namespace-profile-cuda-x86-64, triple: x86_64-unknown-linux-gnu, cuda: "13.3.0", cuda_asset: "133", features: "cuda flash-attn nccl cutile" }
          - { sm: "90", runner: namespace-profile-cuda-arm64, triple: aarch64-unknown-linux-gnu, cuda: "13.3.0", cuda_asset: "133", features: "cuda flash-attn nccl cutile" }
    container:
      image: docker.io/nvidia/cuda:${{ matrix.cuda }}-cudnn-devel-ubuntu22.04
      volumes:
        - /cache:/cache
    env:
      CUDA_COMPUTE_CAP: ${{ matrix.sm }}
      CUDA_TOOLKIT_PATH: /usr/local/cuda
      CUDAFORGE_HOME: /cache/cudaforge-dependencies-v1
      MISTRALRS_CUDA_BUILD_ROOT: /cache/mistralrs-cuda-objects-v1
      # Cap concurrent nvcc: cicc peaks ~7GB on the worst flash-attn kernels and overlaps the rustc
      # phase; 12 rides the 64GB edge on arm64 (OOM kills present as exit 137 or a lost runner).
      CUDAFORGE_THREADS: ${{ contains(matrix.runner, 'arm64') && '8' || '12' }}
      CARGO_BUILD_JOBS: ${{ contains(matrix.runner, 'arm64') && '16' || '32' }}
      RUSTFLAGS: "-C target-cpu=generic"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.build_ref }}
      - name: Install build dependencies
        run: |
          apt-get update
          # clang + libclang-dev: cutile's cuda-bindings runs bindgen over the CUDA headers.
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config libssl-dev patchelf git \
            clang libclang-dev python3-pip
          # CUDA 12.x images can carry a pinned libnccl2 while apt only exposes newer libnccl-dev.
          ldconfig
          nccl_lib="$(ldconfig -p | awk '$1 == "libnccl.so" { print $NF; exit }')"
          if [ -z "$nccl_lib" ]; then
            nccl_runtime="$(ldconfig -p | awk '$1 == "libnccl.so.2" { print $NF; exit }')"
            if [ -z "$nccl_runtime" ]; then
              nccl_runtime="$(find /usr/local/cuda /usr/lib -name 'libnccl.so.2' -print -quit 2>/dev/null || true)"
            fi
            if [ -n "$nccl_runtime" ]; then
              ln -sf "$nccl_runtime" "$(dirname "$nccl_runtime")/libnccl.so"
            else
              apt-get install -y --no-install-recommends libnccl-dev
            fi
          fi
          rm -rf /var/lib/apt/lists/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Rust dependencies
        run: |
          for i in 1 2 3 4 5; do
            cargo fetch --locked && break
            if [ "$i" = 5 ]; then exit 1; fi
            sleep $((i * 20))
          done
      - name: Build
        run: cargo build --release --locked --offline --target "${{ matrix.triple }}" --features "${{ matrix.features }}" -p mistralrs-cli
      - name: Bundle runtime libraries
        run: |
          set -eux
          bin=target/${{ matrix.triple }}/release/mistralrs
          mkdir -p package/lib
          # Copy every CUDA/NCCL/cuDNN shared object the binary actually links, so the
          # artifact runs without a CUDA toolkit installed.
          ldd "$bin" | awk '/=> \//{print $3}' \
            | grep -E 'libcud|libnccl|libcublas|libcurand|libnvrtc|libnvJit|libnvjit' \
            | sort -u | xargs -r -I{} cp -Lv {} package/lib/ || true
          cp "$bin" package/mistralrs
          patchelf --set-rpath '$ORIGIN/lib' package/mistralrs
      - name: Package
        run: |
          set -eux
          name="mistralrs-cuda${{ matrix.cuda_asset }}-sm${{ matrix.sm }}-${{ matrix.triple }}.tar.gz"
          tar czf "$name" -C package .
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        id: upload_binary_asset
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          draft: ${{ needs.preflight.outputs.release_draft }}
          prerelease: ${{ contains(needs.preflight.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: ${{ env.ASSET }}
      - uses: softprops/action-gh-release@v2
        if: ${{ !inputs.dry_run && steps.upload_binary_asset.outcome == 'failure' }}
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          draft: ${{ needs.preflight.outputs.release_draft }}
          prerelease: ${{ contains(needs.preflight.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: ${{ env.ASSET }}
      # CUDA wheel -> release asset (PyPI has no compute-capability or CUDA-toolkit axis). The
      # +cudaNNN.smNN local version keeps wheels distinct and lets pip select; auditwheel bundles
      # the CUDA runtime libs (driver libcuda excluded). cutile is dropped here, so CUDA wheels use
      # the CUTLASS MoE fallback; cutile users need a cutile-enabled CLI binary and an official
      # tileiras installation.
      # Only mistralrs-pyo3's version is bumped (not the workspace) so the kernel crates already built
      # by the CLI step are reused from target/ instead of recompiling flash-attn's ~90min hdim512 ptxas.
      # Fails the job on wheel breakage (binary asset is already uploaded above; docker legs
      # tolerate failed build legs via !cancelled(), so nothing downstream is lost). Pinned
      # pips: an unpinned auditwheel once raised its patchelf floor above apt's 0.14.3 and
      # silently dropped every CUDA wheel from a release.
      - name: Build CUDA wheel
        run: |
          set -eux
          pip3 install --quiet maturin==1.14.1 auditwheel==6.8.1 patchelf==0.19.1.0
          sed -i 's/^version = "\([^"]*\)"/version = "\1+cuda${{ matrix.cuda_asset }}.sm${{ matrix.sm }}"/' mistralrs-pyo3/Cargo.toml
          # --auditwheel skip: maturin's built-in repair has no --exclude and chokes on libcuda; do
          # our own repair below instead so the driver is excluded rather than bundled.
          maturin build --release --target "${{ matrix.triple }}" --features "cuda flash-attn nccl" --auditwheel skip -o wheelraw -m mistralrs-pyo3/Cargo.toml
          # auditwheel must resolve libcuda.so.1 before it can honor --exclude; the build container
          # has only the driver stub (libcuda.so), so symlink it as libcuda.so.1 on the search path.
          stubdir=/usr/local/cuda/lib64/stubs
          ln -sf "$stubdir/libcuda.so" "$stubdir/libcuda.so.1"
          LD_LIBRARY_PATH="$stubdir:${LD_LIBRARY_PATH:-}" \
            auditwheel repair --exclude libcuda.so.1 -w wheelhouse wheelraw/*.whl
      - uses: softprops/action-gh-release@v2
        id: upload_wheel_asset
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          draft: ${{ needs.preflight.outputs.release_draft }}
          prerelease: ${{ contains(needs.preflight.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: wheelhouse/*.whl
      - uses: softprops/action-gh-release@v2
        if: ${{ !inputs.dry_run && steps.upload_wheel_asset.outcome == 'failure' }}
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          draft: ${{ needs.preflight.outputs.release_draft }}
          prerelease: ${{ contains(needs.preflight.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: wheelhouse/*.whl

  windows-cpu:
    needs: preflight
