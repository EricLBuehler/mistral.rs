[type.lfm3-d1-parsing]
extend-glob = ["parsing.rs"]

# Multilingual month names and ordinal suffixes.
[type.lfm3-d1-parsing.extend-words]
januar = "januar"
februar = "februar"
marz = "marz"
juni = "juni"
juli = "juli"
aout = "aout"
oktober = "oktober"
decembre = "decembre"
dezember = "dezember"
nd = "nd"
