[workspace]
members = [
    "mistralrs-server-core",
    "mistralrs-cli",
    "mistralrs-core",
    "mistralrs-pyo3",
    "mistralrs",
    "mistralrs-vision",
    "mistralrs-quant",
    "mistralrs-paged-attn",
    "mistralrs-metal-compile",
    "mistralrs-flash-attn",

    "mistralrs-audio",
    "mistralrs-mcp",
    "mistralrs-macros",
    "mistralrs-code-exec",
    "mistralrs-sandbox",
]
# Root builds skip mistralrs-pyo3; unifying its pyo3 features would link libpython into the CLI
default-members = [
    "mistralrs-server-core",
    "mistralrs-cli",
    "mistralrs-core",
    "mistralrs",
    "mistralrs-vision",
    "mistralrs-quant",
    "mistralrs-paged-attn",
    "mistralrs-metal-compile",
    "mistralrs-flash-attn",
    "mistralrs-audio",
    "mistralrs-mcp",
    "mistralrs-macros",
    "mistralrs-code-exec",
    "mistralrs-sandbox",
]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2021"
description = "Fast, flexible LLM inference."
homepage = "https://github.com/EricLBuehler/mistral.rs"
repository = "https://github.com/EricLBuehler/mistral.rs"
keywords = ["llm", "inference", "machine-learning", "ai", "transformers"]
categories = ["science", "api-bindings", "text-processing"]
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
candle-core = { version = "0.11.0", git = "https://github.com/haricot/candle.git", rev = "bfce966ad4d61a48801eb6af4db8b8eabebc01a8" }
candle-nn = { version = "0.11.0", git = "https://github.com/haricot/candle.git", rev = "bfce966ad4d61a48801eb6af4db8b8eabebc01a8" }
candle-flash-attn-v3 = { version = "0.11.0", git = "https://github.com/haricot/candle.git", rev = "bfce966ad4d61a48801eb6af4db8b8eabebc01a8" }
candle-metal-kernels = { version = "0.11.0", git = "https://github.com/haricot/candle.git", rev = "bfce966ad4d61a48801eb6af4db8b8eabebc01a8" }
# candle-core = { path = "../candle/candle-core", version = "0.11.0" }
# candle-nn = { path = "../candle/candle-nn", version = "0.11.0" }
# candle-flash-attn-v3 = { path = "../candle/candle-flash-attn-v3", version = "0.11.0" }
# candle-metal-kernels = { path = "../candle/candle-metal-kernels", version = "0.11.0" }
# candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "9515d410e3af803fd45efebfef8137f47d85a63d" }
# candle-nn = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "9515d410e3af803fd45efebfef8137f47d85a63d" }
# candle-flash-attn-v3 = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "9515d410e3af803fd45efebfef8137f47d85a63d" }
# candle-metal-kernels = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "9515d410e3af803fd45efebfef8137f47d85a63d" }

axum = "0.8.9"
http-body-util = "0.1.5"
mimalloc = "0.1"
anyhow = "1.0.100"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.10.9"
indexmap = { version = "2.13.0", features = ["serde"] }
either = { version = "1.15.0", features = ["serde"] }
accelerate-src = { version = "0.3.2" }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
futures = "0.3.34"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
pyo3 = { version = "0.25.1", features = ["full", "either", "abi3-py310"] }
tokio = { version = "1.54.1", features = ["full", "rt-multi-thread"] }
# All features but avif, avif increases the msrv dramatically
image = { version = "0.25.10", default-features = false, features = [
    'bmp',
    'dds',
    'exr',
    'ff',
    'gif',
    'hdr',
    'ico',
    'jpeg',
    'png',
    'pnm',
    'qoi',
    'tga',
    'tiff',
    'webp',
] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "rustls",
    "charset",
    "http2",
] }
base64 = "0.22.1"
tempfile = "3"
half = "2.7.1"
rayon = "1.11.0"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["indexmap"] }
walkdir = "2.5.0"
data-url = "0.3.2"
float8 = "0.7.0"
regex = "1.12.4"
fancy-regex = "0.14.0"
objc2-metal = "0.3.2"
objc2-foundation = "0.3.2"
dispatch2 = { version = "0.3.0", default-features = false, features = ["block2"] }
safetensors = "0.8.0"
toml = "0.9.11"
hf-hub = { git = "https://github.com/huggingface/hf-hub.git", rev = "473de9430b0fbc544fb1d91102180eb713f8dc87", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
itertools = "0.14.0"
rand = "0.9.3"
rand_distr = "0.5.1"
dirs = "6.0.0"
thiserror = "2.0.18"
tokenizers = { version = "0.21.4", default-features = false }
tokio-tungstenite = "0.29.0"
tqdm = "0.8.0"
chrono = "0.4.43"
minijinja = { version = "2.14.0", features = ["builtins", "json", "preserve_order"] }
minijinja-contrib = { version = "2.14.0", features = ["pycompat"] }
regex-automata = { version = "0.4.18", features = ["meta"] }
rustc-hash = "2.1.1"
vob = "3.0.6"
cfgrammar = "0.14.1"
lrtable = "0.14.1"
galil-seiferas = "0.1.5"
radix_trie = "0.3.0"
bytemuck = "1.24.0"
tokio-rayon = "2.1.0"
rand_isaac = "0.4.0"
indicatif = { version = "0.18.3", features = ["rayon"] }
async-trait = "0.1.92"
strum = { version = "0.27.2", features = ["derive"] }
derive_more = { version = "2.1.1", default-features = false, features = ["from"] }
akin = "0.4.0"
variantly = "0.4.0"
sysinfo = "0.36.1"
csv = "1.4.0"
bytemuck_derive = "1.10.2"
uuid = "1.19.0"
schemars = "1.2.0"
serde-saphyr = "0.0.16"
serde_plain = "1.0.2"
as-any = "0.3.2"
llguidance = { version = "1.2.0", default-features = false, features = ["lark"] }
toktrie_hf_tokenizers = "1.2.0"
toktrie = "1.4.0"
objc = { version = "0.2.7" }
serde-big-array = "0.5.1"
interprocess = "2.2.3"
urlencoding = "2.1.3"
scraper = "0.25.0"
html2text = "0.16.6"
zip = { version = "9.1.3", default-features = false, features = ["deflate"], git = "https://github.com/zip-rs/zip2.git", rev = "af2ed2a3e12af1fdd733b1886b3e9067bf510be5" }
ordered-float = "5.1.0"
hashbrown = "0.16.1"
parking_lot = "0.12.5"
ahash = "0.8.12"
num-traits = "0.2.19"
libc = "0.2.180"
bm25 = "2.3.2"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "vorbis", "wav", "isomp4", "ogg", "pcm"] }
lazy_static = "1.5"
paste = "1.0.15"
byteorder = "1.5.0"
yoke = { version = "0.8.1", features = ["derive"] }
memmap2 = "0.9.12"
pyo3-build-config = "0.25.1"
ctrlc = "3.5.1"
directories = "6.0.0"
# Need to keep rustyline at 15.0.0 as 16.0.0 has a breaking change that conficts with `ctrlc`'s handling
rustyline = { version = "15.0.0", default-features = false, features = ["with-file-history"] }
tower-http = "0.6.11"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
futures-util = "0.3.34"
axum_static = "1.8.6"
mime_guess = "2.0.5"
include_dir = "0.7.4"
http = "1.5.0"
http-body = "1.1.0"
hyper = "1.12.0"
rust-mcp-schema = { version = "0.9.5", default-features = false, features = ["schema_utils", "latest"] }
cudaforge = "=0.1.6"
rubato = "0.16.2"
rustfft = "6.4.1"
hound = "3.5.1"
apodize = "1.0.0"
statrs = "0.18.0"
seccompiler = "0.5.0"
landlock = "0.4.4"
nix = { version = "0.31.3", default-features = false }
itoa = "1.0.18"
cutile = "=0.3.1"

mistralrs-core = { path = "mistralrs-core", version = "0.10.0" }
mistralrs-paged-attn = { path = "mistralrs-paged-attn", version = "0.10.0" }
mistralrs-metal-compile = { path = "mistralrs-metal-compile", version = "0.10.0" }
mistralrs-flash-attn = { path = "mistralrs-flash-attn", version = "0.10.0" }
mistralrs-quant = { path = "mistralrs-quant", version = "0.10.0" }
mistralrs-vision = { path = "mistralrs-vision", version = "0.10.0" }
mistralrs-server-core = { path = "mistralrs-server-core", version = "0.10.0" }
mistralrs = { path = "mistralrs", version = "0.10.0" }
mistralrs-audio = { path = "mistralrs-audio", version = "0.10.0" }
mistralrs-mcp = { path = "mistralrs-mcp", version = "0.10.0" }
mistralrs-macros = { path = "mistralrs-macros", version = "0.10.0" }
mistralrs-code-exec = { path = "mistralrs-code-exec", version = "0.10.0" }
mistralrs-sandbox = { path = "mistralrs-sandbox", version = "0.10.0" }

[profile.release-with-debug]
inherits = "release"
debug = true

# Makes release profiler faster to build
# The improvement is negligible with it.
# [profile.release]
# lto = true
# opt-level = 3

[profile.dev]
debug = true
opt-level = 3

[profile.campaign]
inherits = "dev"
opt-level = 1
debug = 0
incremental = false
codegen-units = 8

[profile.campaign.package.mistralrs-core]
opt-level = 0
